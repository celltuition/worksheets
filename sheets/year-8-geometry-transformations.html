 C':-2,-1","v":1}]}]},{"title":"Reflection","mode":"sheet","level":2,"hint":"Each point and its image are the same distance from the mirror line, on opposite sides of it.","example":{"q":"Reflect the shape in the \\(y\\)-axis.","above":true,"img":"graph:shape A:2,1 B:4,1 C:2,3","aimg":"graph:shape A:2,1 B:4,1 C:2,3; image A':-2,1 B':-4,1 C':-2,3","at":"A′(−2, 1), B′(−4, 1), C′(−2, 3)","v":1},"work":16,"v1":[{"stem":"Draw the image of each shape.","cols":2,"scale":0.6,"ascale":0.36,"noBlank":true,"split":true,"answerCols":2,"parts":[{"q":"Reflect the shape in the \\(y\\)-axis.","img":"graph:shape A:2,1 B:5,1 C:2,4","above":true,"v":1},{"q":"Reflect the shape in the \\(x\\)-axis.","img":"graph:shape A:1,1 B:4,1 C:4,3","above":true,"v":1},{"q":"Reflect the shape in the line \\(x = 1\\) (the dashed line).","img":"graph:shape A:2,2 B:4,2 C:4,5; mirror x=1","above":true,"v":1},{"q":"Reflect the shape in the line \\(y = 2\\) (the dashed line).","img":"graph:shape A:-5,3 B:-2,3 C:-5,5; mirror y=2","above":true,"v":1}]}],"v2":[{"stem":"Draw the image of each shape.","cols":2,"scale":0.6,"ascale":0.36,"noBlank":true,"split":true,"answerCols":2,"parts":[{"q":"Reflect the shape in the \\(y\\)-axis.","img":"graph:shape A:1,2 B:4,2 C:1,4","above":true,"v":1},{"q":"Reflect the shape in the \\(x\\)-axis.","img":"graph:shape A:2,1 B:5,1 C:5,4","above":true,"v":1},{"q":"Reflect the shape in the line \\(x = 2\\) (the dashed line).","img":"graph:shape A:3,1 B:5,1 C:5,3; mirror x=2","above":true,"v":1},{"q":"Reflect the shape in the line \\(y = 1\\) (the dashed line).","img":"graph:shape A:-4,2 B:-1,2 C:-4,4; mirror y=1","above":true,"v":1}]}]},{"title":"Rotation","mode":"sheet","level":3,"hint":"Every point turns through the same angle about the centre. Tracing paper helps: trace the shape, hold the centre still and turn.","example":{"q":"Rotate the shape 180° about the point O.","above":true,"img":"graph:shape A:1,1 B:3,1 C:3,2; point O 0 0","aimg":"graph:shape A:1,1 B:3,1 C:3,2; imag
