ents are shorter than 160 cm?","v":1},{"q":"Can you tell the height of the tallest student from the graph? Explain.","v":1}]}],"v2":[{"stem":"The histogram shows the heights of the students in a Year 9 class.","cols":1,"scale":0.56,"img":"hist:x 140 190 10 Height (cm); y 0 12 2 Number of students; 3 5 9 12 4","parts":[{"q":"How many students are between 150 cm and 160 cm tall?","v":1},{"q":"How many students are in the class?","v":1},{"q":"Which interval has the most students?","v":1},{"q":"How many students are 170 cm or taller?","v":1},{"q":"How many students are shorter than 160 cm?","v":1},{"q":"Can you tell the height of the tallest student from the graph? Explain.","v":1}]}]},{"title":"Time-series graphs","mode":"book","level":3,"hint":"A time-series graph shows how something changes over time. Look for the overall trend as well as the ups and downs.","example":{"img":"series:x 2020 2024 1 Year; y 0 50 10 Members; 20 30 25 35 40","q":"The graph shows the number of members of a club each year. Between which two years did the number of members fall, and by how many?","w":"30 - 25","at":"Between 2021 and 2022, by 5 members.","v":1},"work":16,"v1":[{"stem":"The graph shows the number of visitors to a museum each year, in thousands.","cols":1,"scale":0.6,"img":"series:x 2016 2024 1 Year; y 0 60 10 Visitors (thousands); 20 25 30 35 10 20 35 45 50","parts":[{"q":"How many thousand visitors came in 2018?","v":1},{"q":"In which year were there the most visitors?","v":1},{"q":"How many thousand more visitors came in 2023 than in 2018?","v":1},{"q":"Between which two years did the number of visitors fall?","v":1},{"q":"How many thousand visitors were lost in that fall?","v":1},{"q":"Describe the overall trend from 2016 to 2024.","v":1}]}],"v2":[{"stem":"The graph shows the number of visitors to a museum each year, in thousands.","cols":1,"scale":0.6,"img":"series:x 2016 2024 1 Year; y 0 60 10 Visitors (thousands); 15 20 30 40 10 15 30 40 55","parts":[{"q":"How many thous
