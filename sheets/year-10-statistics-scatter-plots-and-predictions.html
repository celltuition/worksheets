mber of hot drinks sold.","v":"words"},{"q":"A weak negative relationship between the age of a car and its value.","v":"words"},{"q":"No relationship between shoe size and spelling score.","v":"words"},{"q":"A weak positive relationship between hours of sleep and test score.","v":"words"}]}],"v2":[{"stem":"For each relationship, write what it means in the situation, starting with \"As ...\".","cols":1,"answerCols":1,"parts":[{"q":"A strong negative relationship between hours of sleep and reaction time.","v":"words"},{"q":"A strong positive relationship between distance to school and travel time.","v":"words"},{"q":"A weak positive relationship between the number of pets and weekly pocket money.","v":"words"},{"q":"No relationship between house number and electricity bill.","v":"words"},{"q":"A strong negative relationship between the age of a phone and its battery life.","v":"words"}]}]},{"title":"The line of best fit","mode":"book","level":3,"hint":"A line of best fit follows the trend of the points, with about as many points above it as below. Put a value into its equation to make a prediction.","example":{"q":"The line of best fit is \\(n = 8t - 60\\). Predict n when t = 20.","w":"8 \\times 20 - 60","a":"100","v":1},"work":30,"v1":[{"stem":"A shop records the noon temperature and the number of ice creams it sells on twelve days. The line of best fit is \\(n = 8t - 60\\).","cols":1,"scale":0.6,"img":"scatter:x 10 30 5 Noon temperature (°C); y 0 200 20 Ice creams sold; 11,30 13,40 14,55 16,65 17,80 19,90 20,105 22,112 23,128 25,138 27,160 29,170; fit 8 -60","answerCols":1,"parts":[{"q":"Write the sentence that describes the relationship.","v":1},{"q":"Predict the number of ice creams sold when the temperature is 18°C.","v":1},{"q":"Predict the number of ice creams sold when the temperature is 24°C.","v":1},{"q":"What temperature gives a predicted number of ice creams sold of 100?","v":1}]}],"v2":[{"stem":"A music teacher records the hours her students practise each week and their exam marks. The line of best fit is \\(m = 6h + 22\\).","cols":1,"scale":0.6,"img":"scatter:x 0 12 1 Hours of practice each week; y 0 100 10 Music exam mark (%); 1,30 2,32 2,38 3,40 4,44 5,55 6,56 7,66 8,68 9,78 10,80 11,90; fit 6 22","answerCols":1,"parts":[{"q":"Write the sentence that describes the relationship.","v":1},{"q":"Predict the exam mark when the practice time is 3 hours.","v":1},{"q":"Predict the exam mark when the practice time is 8 hours.","v":1},{"q":"What practice time gives a predicted exam mark of 82%?","v":1}]}]},{"title":"Interpolation and extrapolation","mode":"book","level":3,"hint":"A prediction inside the range of the data is interpolation. A prediction outside it is extrapolation, which is less reliable because we have not seen what happens there.","example":{"q":"The data run from 11°C to 29°C. Is a prediction at 35°C interpolation or extrapolation?","at":"Extrapolation, because 35°C is outside the range of the data.","v":"words"},"work":26,"v1":[{"stem":"Use the data in the question above. Is a prediction for each of these values interpolation or extrapolation?","cols":2,"answerCols":1,"parts":[{"q":"a temperature of 20°C","v":1},{"q":"a temperature of 35°C","v":1},{"q":"a temperature of 12°C","v":1},{"q":"a temperature of 8°C","v":1}]},{"stem":"The line is used to predict the number of ice creams sold when the temperature is 40°C.","cols":1,"answerCols":1,"parts":[{"q":"What does the line predict?","v":1},{"q":"Explain why this prediction may not be reliable.","v":"words"}]}],"v2":[{"stem":"Use the data in the question above. Is a prediction for each of these values interpolation or extrapolation?","cols":2,"answerCols":1,"parts":[{"q":"a practice time of 5 hours","v":1},{"q":"a practice time of 14 hours","v":1},{"q":"a practice time of 10 hours","v":1},{"q":"a practice time of 0.5 hours","v":1}]},{"stem":"The line is used to predict the exam mark when the practice time is 15 hours.","cols":1,"answerCols":1,"parts":[{"q":"What does the line predict?","v":1},{"q":"Explain why this prediction may not be reliable.","v":"words"}]}]},{"title":"Outliers and cause","mode":"book","level":3,"hint":"An outlier is a point far from the pattern of the others. A relationship on a scatter plot does not prove that one thing causes the other: something else may be behind both.","example":{"q":"One point on a scatter plot sits far from the pattern of the others. What is it called?","at":"An outlier.","v":"words"},"work":30,"v1":[{"stem":"The scatter plot shows the hours a group of students spent revising and their test marks.","cols":1,"scale":0.56,"img":"scatter:x 0 12 2 Hours of revision; y 0 80 10 Test mark (%); 1,20 2,26 3,31 4,35 5,42 6,46 7,52 8,55 9,61 10,66 8,15","answerCols":1,"parts":[{"q":"One point is an outlier. Give its coordinates.","v":1},{"q":"Suggest a reason for the outlier.","v":"words"},{"q":"Ignoring the outlier, write the sentence that describes the relationship.","v":1},{"q":"A student says: \"This proves that revising for more hours causes a higher mark.\" Is that a fair conclusion? Explain.","v":"words"},{"q":"The outlier is removed and a line of best fit is drawn for the other points. Would the line sit higher or lower than a line drawn with the outlier included? Explain.","v":"words"}]},{"stem":"Over ten summers, ice cream sales and the number of people treated for sunburn both went up and down together, giving a strong positive relationship. Does eating ice cream cause sunburn? What is really going on?","v":"words"}],"v2":[{"stem":"The scatter plot shows the hours a group of students spent revising and their test marks.","cols":1,"scale":0.56,"img":"scatter:x 0 12 2 Hours of revision; y 0 80 10 Test mark (%); 1,62 2,58 3,53 4,50 5,44 6,40 7,35 8,31 9,26 10,21 3,18","answerCols":1,"parts":[{"q":"One point is an outlier. Give its coordinates.","v":1},{"q":"Suggest a reason for the outlier.","v":"words"},{"q":"Ignoring the outlier, write the sentence that describes the relationship.","v":1},{"q":"A student says: \"This proves that revising for more hours causes a higher mark.\" Is that a fair conclusion? Explain.","v":"words"},{"q":"The outlier is removed and a line of best fit is drawn for the other points. Would the line sit higher or lower than a line drawn with the outlier included? Explain.","v":"words"}]},{"stem":"Over ten summers, ice cream sales and the number of people treated for sunburn both went up and down together, giving a strong positive relationship. Does eating ice cream cause sunburn? What is really going on?","v":"words"}]},{"title":"Extension","mode":"book","extension":true,"work":30,"v1":[{"stem":"In the equation of the line of best fit for the ice cream data, what does the number 8 tell you about the number of ice creams sold?","v":"words"},{"stem":"The line predicts −60 ice creams at 0°C. What is wrong with this, and why does it happen?","v":"words"},{"stem":"Two scatter plots both show a positive relationship. On one the points lie close to a line; on the other they are widely scattered. Which gives the more reliable predictions, and why?","v":"words"},{"stem":"A line of best fit is drawn for 12 points. Eleven of the points are above the line and one is below it. Is it a good line of best fit? Explain.","v":"words"}],"v2":[{"stem":"In the equation of the line of best fit for the music exam data, what does the number 6 tell you about the exam mark?","v":"words"},{"stem":"The line predicts a mark of 22% for a student who does no practice. Is this prediction interpolation or extrapolation? How much would you trust it?","v":"words"},{"stem":"Two scatter plots both show a positive relationship. On one the points lie close to a line; on the other they are widely scattered. Which gives the more reliable predictions, and why?","v":"words"},{"stem":"A line of best fit is drawn for 12 points. Eleven of the points are above the line and one is below it. Is it a good line of best fit? Explain.","v":"words"}]}]};</script>
