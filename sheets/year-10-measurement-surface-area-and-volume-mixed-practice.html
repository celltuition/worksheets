<script>window.SHEET = {"code":"Y10-MEA-W19","year":"Year 10","span":[10,11],"strand":"Measurement","title":"Surface Area and Volume: Mixed Practice","calculator":true,"quiz":"year-10-measurement","keywords":["surface area","volume","capacity","net"],"public":true,"sections":[{"title":"Both at once","mode":"book","level":2,"hint":"Surface area is the total area of the faces (square units). Volume is the space inside (cubic units). Write both formulas down before you start.","example":{"q":"A cuboid is 6 cm by 3 cm by 2 cm. Find its surface area and its volume.","w":["\\text{Surface area: } 2 \\times (6 \\times 3 + 6 \\times 2 + 3 \\times 2) = 72\\text{ cm}^2","\\text{Volume: } 6 \\times 3 \\times 2"],"a":"36\\textbf{ cm}^{\\mathbf{3}}","v":1},"v1":[{"stem":"A cuboid 8 cm by 5 cm by 4 cm.","cols":2,"scale":0.4,"img":"draw:prism 0,0 6,0 6,3 0,3 3.75 / 8 cm / - / - / 4 cm / 5 cm","work":30,"answerCols":2,"parts":[{"q":"Find its surface area.","v":1},{"q":"Find its volume.","v":1}]},{"stem":"A cylinder with radius 3 cm and height 10 cm. Give answers to 1 decimal place.","cols":2,"scale":0.4,"img":"draw:cyl 3 9 / 3 cm / 10 cm","work":30,"answerCols":2,"parts":[{"q":"Find its surface area.","v":1},{"q":"Find its volume.","v":1}]},{"stem":"A triangular prism. Its end is a right-angled triangle with sides 6 m, 8 m and 10 m, and it is 12 m long.","cols":2,"scale":0.4,"img":"draw:prism 0,0 3,0 0,4 6 / 6 m / 10 m / - / 12 m; ra 0,0 3,0 0,4; dim -0.8,0 -0.8,4 / 8 m","work":30,"answerCols":2,"parts":[{"q":"Find its surface area.","v":1},{"q":"Find its volume.","v":1}]},{"stem":"A cone with radius 6 cm and height 8 cm. Give answers to 1 decimal place.","cols":2,"scale":0.4,"img":"draw:cone 3 5 / 6 cm / 8 cm","work":30,"answerCols":2,"parts":[{"q":"Find its surface area.","v":1},{"q":"Find its volume.","v":1}]},{"stem":"A sphere with radius 4 m. Give answers to 1 decimal place.","cols":2,"scale":0.4,"img":"draw:sphere 3 / 4 m","work":30,"answerCols":2,"parts":[{"q":"Find its surfa nk, open at the top, has a radius of 1 m and a height of 1.2 m.","cols":1,"work":32,"answerCols":1,"parts":[{"q":"How many litres does it hold, to the nearest litre? (1 m³ = 1000 L.)","v":1},{"q":"The outside (the curved side and the base) is painted. Paint costs $8 per square metre. Find the cost, to the nearest dollar.","v":1}]},{"stem":"A grain silo is a cylinder of radius 2.5 m and height 12 m with a hemisphere of the same radius on top. Find its volume, to the nearest cubic metre.","work":34,"v":1},{"stem":"A food tin is a cylinder with radius 3.5 cm and height 12 cm.","cols":1,"work":30,"answerCols":1,"parts":[{"q":"Find the area of metal in the tin, to 1 decimal place.","v":1},{"q":"Find how many millilitres it holds, to the nearest millilitre. (1 cm³ = 1 mL.)","v":1}]}]},{"title":"Extension","mode":"book","extension":true,"v1":[{"stem":"A solid is enlarged by a scale factor of 3. What happens to its surface area and to its volume? Use a cube with edges of 2 cm to check.","work":40,"v":"words"}],"v2":[{"stem":"A solid is enlarged by a scale factor of 3. What happens to its surface area and to its volume? Use a cube with edges of 3 cm to check.","work":40,"v":"words"}]}]};</script>
